<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ask Maple &amp; Main</title>
<style>
:root{--cream:#fbf8f2;--paper:#fff;--ink:#2b1f19;--muted:#7a675b;--line:#e8dccd;--maple:#a8431f;--tint:#f6e7dc;
--serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:"Gill Sans","Gill Sans MT","Avenir Next",Avenir,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
body{padding:16px;display:flex;justify-content:center}
.chat{width:100%;max-width:1100px;height:100%;background:var(--paper);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;box-shadow:0 10px 30px rgba(43,31,25,.08)}
.head{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--ink);color:var(--cream)}
.hd{display:flex;flex-direction:column;flex:1;min-width:0}
.hd b{font-family:var(--serif);font-weight:normal;font-size:22px;line-height:1.1}
.hd span{font-size:12px;letter-spacing:.08em;opacity:.8;display:flex;align-items:center;gap:6px}
.hd .x{display:inline}@media (max-width:480px){.hd .x{display:none}}.hd i{width:7px;height:7px;border-radius:50%;background:#7fbf7f;display:inline-block}
.av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--maple);color:#fff;font-size:10px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;justify-content:center}
.av.lg{width:40px;height:40px;font-size:12px;border:2px solid rgba(251,248,242,.35)}
.live{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--cream);text-decoration:none;border:1px solid rgba(251,248,242,.45);border-radius:999px;padding:6px 12px;white-space:nowrap}
.live:hover,.live:focus-visible{background:var(--maple);border-color:var(--maple)}
#log{grid-column:1;grid-row:2;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:22px 24px;background:var(--cream);overscroll-behavior:contain}
.bot{display:flex;gap:10px;align-items:flex-end;max-width:94%;animation:in .3s ease both}
.me{align-self:flex-end;max-width:80%;background:var(--maple);color:#fff;padding:9px 15px;border-radius:16px 16px 4px 16px;overflow-wrap:anywhere;animation:in .2s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub{background:var(--paper);border:1px solid var(--line);padding:12px 16px;border-radius:16px 16px 16px 4px;min-width:0}
.bub p{margin:0}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.more{display:inline-block;margin-top:8px;color:var(--maple);font-weight:600;text-decoration:none}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.cards.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s,transform .15s}
.hint{margin-top:8px!important;font-size:12px;color:var(--muted)}
.cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nm{font-family:var(--serif);font-size:15px;line-height:1.25;flex:1}
.card .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:12px;color:var(--muted)}
.card .row b{font-size:15px;color:var(--maple);font-variant-numeric:tabular-nums}
.side{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;gap:12px;padding:20px 22px;border-left:1px solid var(--line);min-height:0;overflow-y:auto}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:transparent}
.tab[aria-selected=true]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chip{font:inherit;cursor:pointer;font-size:14px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);transition:border-color .15s,color .15s}
.chip:hover,.chip:focus-visible{border-color:var(--maple);color:var(--maple)}
.foot{margin:auto 0 0;font-size:13px;color:var(--muted)}
.foot a{color:var(--maple)}
form{grid-column:1;grid-row:3;display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--paper)}
#q{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
#q:focus{outline:2px solid var(--maple);outline-offset:1px}
.send{font:inherit;font-weight:600;background:var(--maple);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--maple);outline-offset:2px}
@media (max-width:1000px){.chip{font-size:13px;padding:6px 11px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
 body{padding:8px}
 .chat{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto}
 .head{padding:10px 14px}.hd b{font-size:19px}.live{font-size:10px;padding:5px 9px}
 #log{padding:14px;gap:10px}
 .cards,.cards.n4{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
 .card{flex:0 0 62%;scroll-snap-align:start}
 .side{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--line);padding:10px 14px;gap:8px;overflow:visible}
 .side .lbl,.foot{display:none}
 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
 .chip{white-space:nowrap}
 .tab{font-size:11px;padding:5px 9px}
 form{grid-row:4;padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){.bot,.me{animation:none}.card{transition:none}}
</style>
</head>

const $=s=>document.querySelector(s), log=$('#log');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PR=Object.fromEntries(D.pr.map(p=>[p.id,p]));

const card=p=>`<div class="card"><span class="cat">${esc(p.c)}</span><span class="nm">${esc(p.n)}</span><span class="row"><b>$${p.p.toFixed(2)}</b><span>Order online</span></span></div>`;
function botHTML(text,ids,link){
  const ps=ids.map(i=>PR[i]).filter(Boolean);
  return `<p>${esc(text)}</p>${ps.length?`<div class="cards${ps.length==4?' n4':''}">${ps.map(card).join('')}</div><p class="hint">Search any of these with the search bar at the top of the page to add it to your cart.</p>`:''}`;
}
function addMe(t){const d=document.createElement('div');d.className='me';d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function addBot(html,delay){
  const d=document.createElement('div');d.className='bot';d.innerHTML=`<span class="av">M&amp;M</span><div class="bub"><span class="typing"><span></span><span></span><span></span></span></div>`;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
  setTimeout(()=>{d.querySelector('.bub').innerHTML=html;log.scrollTop=log.scrollHeight},delay);
}

// ---------- matching ----------
const norm=s=>' '+s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9$&'. ]+/g,' ').replace(/\s+/g,' ').trim()+' ';
const has=(q,k)=>q.includes(' '+k+' ')||q.includes(' '+k+'s ')||(k.length>4&&q.includes(k));
const TYPES=['red','white','rose','rosé','sparkling','wine','bourbon','whiskey','whisky','scotch','rye','vodka','tequila','gin','rum','spirits','liquor','beer','ipa','lager','stout','wheat','seltzer','sake','champagne','prosecco','cabernet','merlot','malbec','zinfandel','pinot noir','chardonnay','sauvignon blanc','pinot grigio','riesling','mixer','tonic','ice','corkscrew','light','craft'];
function answer(raw){
  const q=norm(raw);
  if(/\b(i'?m|i am|im)\s*(1[0-9]|20)\b|\bunder 21\b|\bnot 21\b|\bminor\b/.test(q))
    return {t:"Sorry, you need to be 21 or older to buy from us. Thanks for understanding!",ids:[]};
  if(/^\s*(hi|hey|hello|yo|hiya|good (morning|afternoon|evening))\b/.test(q.trim())&&q.trim().split(' ').length<=3)
    return {t:"Hey there! Ask me about a bottle, a pairing, prices or how pickup works. Or tap one of the popular questions.",ids:[]};
  if(/\b(thanks|thank you|thx|ty)\b/.test(q)) return {t:"Anytime! Cheers, and see you at the counter.",ids:[]};
  const price=(q.match(/(?:under|below|less than|cheaper than|max|up to|around|about)\s*\$?\s*(\d+)/)||q.match(/\$\s*(\d+)/)||[])[1];
  const types=TYPES.filter(k=>has(q,k));
  // 1) product name match ("do you have copper fox")
  const words=q.trim().split(' ').filter(w=>w.length>3&&!['have','carry','sell','what','your','with','good','best','wine','beer','some','that','this','there','under','bottle','about','something','recommend'].includes(w));
  let named=D.pr.map(p=>{const n=norm(p.n);return [p,words.filter(w=>n.includes(' '+w)).length]}).filter(x=>x[1]>=1);
  const brandHits=named.filter(([p,s])=>s>=1&&!types.some(t=>norm(p.n).includes(' '+t+' ')&&s==1));
  // 2) QA match
  let best=null,bs=0;
  D.qa.forEach(a=>{let s=0;a.kw.forEach(k=>{if(has(q,k))s+=k.includes(' ')?3:2});norm(a.q).split(' ').forEach(w=>{if(w.length>4&&q.includes(' '+w+' '))s+=1});if(s>bs){bs=s;best=a}});
  // price / type browsing beats generic QA
  if(price||(types.length&&bs<3&&(!brandHits.length||types.some(t=>t.includes(' '))))){
    let list=D.pr.filter(p=>!types.length||types.some(t=>p.t.includes(t)||norm(p.n).includes(' '+t)));
    if(price) list=list.filter(p=>p.p<=+price);
    list.sort((a,b)=>a.p-b.p);
    const label=types.length?types.join(' / '):'everything';
    if(list.length){
      const pick=list.length>4?[list[0],list[Math.floor(list.length/3)],list[Math.floor(2*list.length/3)],list[list.length-1]]:list;
      const uniq=[...new Map(pick.map(p=>[p.id,p])).values()];
      return {t:`${price?`Here's ${label} at $${price} or less`:`Here's the ${label} we carry online`}${list.length>uniq.length?`, a few picks from ${list.length} options`:''}. Sorted by price:`,ids:uniq.map(p=>p.id),l:[D.base+'/products','See everything']};
    }
    if(price&&types.length) return {t:`We don't have ${label} at $${price} or less online right now. Want to stretch the budget a little? Ask me again with a higher number.`,ids:[]};
  }
  if(best&&bs>=2) return {t:best.a,ids:best.ids,l:best.l};
  if(brandHits.length){
    const top=brandHits.sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
    return {t:top.length==1?`Yes, we carry ${top[0].n} for $${top[0].p.toFixed(2)}, ready for in-store pickup.`:`Yes, here's what we have:`,ids:top.map(p=>p.id)};
  }
  if(best&&bs>=1) return {t:best.a,ids:best.ids,l:best.l};
  return {t:"I'm not sure about that one. Try asking about a type of drink, a price (\"red under $15\"), a food pairing or pickup. For anything else, call us at (555) 010-2200.",ids:[]};
}
function ask(text){
  text=text.trim();if(!text)return;addMe(text);
  const r=answer(text);addBot(botHTML(r.t,r.ids||[],r.l),450+Math.min(700,r.t.length*4));
}

// ---------- UI ----------
let gi=1;
function renderTabs(){
  $('#tabs').innerHTML=D.groups.map((g,i)=>`<button type="button" class="tab" role="tab" aria-selected="${i==gi}" data-i="${i}">${esc(g)}</button>`).join('');
  $('#chips').innerHTML=D.qa.filter(a=>a.g==D.groups[gi]).map(a=>`<button type="button" class="chip">${esc(a.q)}</button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){gi=+b.dataset.i;renderTabs()}});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)ask(b.textContent)});
$('#f').addEventListener('submit',e=>{e.preventDefault();const v=$('#q').value;$('#q').value='';ask(v)});
renderTabs();
addBot(botHTML("Hi! I'm the Maple & Main shop helper. Ask me for a bottle, a pairing, prices or pickup info, or tap a question.",[]),0);
